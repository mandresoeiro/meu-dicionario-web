<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu Dicionário Pessoal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f2e8;color:#172c2a;font:16px system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ac6b25;outline-offset:3px}aside{background:#073e43;color:#fff8e9;padding:32px 22px;min-height:100dvh;display:flex;flex-direction:column;gap:12px}.brand{font:bold 28px Georgia;margin:0 0 20px;border-bottom:1px solid #b68547;padding-bottom:28px}.brand span{color:#e7ba78;display:block;font-size:33px}aside button{text-align:left;background:transparent;border:0;color:inherit;padding:12px;border-radius:8px}aside button:hover,aside button[aria-pressed=true]{background:#ffffff22}body{display:grid;grid-template-columns:230px minmax(0,1fr)}main{width:100%;max-width:1280px;margin:auto;padding:clamp(18px,4vw,52px);align-self:start;margin-top:0}header,.tools,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1,h2{font-family:Georgia,serif;overflow-wrap:anywhere}h1{font-size:clamp(35px,5vw,64px);margin:0 0 12px}h2{font-size:clamp(34px,5vw,62px);margin:0}.tools{margin:16px 0 22px}.tools input{flex:1 1 250px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button,.action{border:1px solid #9aab9e;border-radius:9px;padding:9px 13px;background:#fffaf1}.chips button[aria-pressed=true],.primary{background:#085359;color:white;border-color:#085359}.new{background:#864c20;color:white;border-color:#864c20}input,textarea,select{width:100%;padding:10px;border:1px solid #a5ada2;border-radius:7px;background:#fffdf8;color:#142725}.columns{display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,2.25fr);gap:16px}.list,.entry{border:1px solid #d9cdb8;border-radius:14px;background:#fffbf3;padding:12px;min-width:0}.entry{padding:clamp(18px,4vw,36px);overflow-wrap:anywhere}.word{display:block;width:100%;border:0;border-bottom:1px solid #e5dac8;background:none;text-align:left;padding:13px 10px;overflow-wrap:anywhere}.word strong{font:700 23px Georgia}.word small{display:block;margin-top:4px}.word[aria-current=true]{background:#e0ebe3;border-left:4px solid #a46a31;border-radius:7px}.entry-head{border-bottom:1px solid #b88b53;padding-bottom:16px}.entry-head em{color:#46554e}.senses{padding-left:25px;line-height:1.6}.senses li::marker{color:#864c20;font-weight:bold}blockquote{margin:16px 0;padding:14px 18px;background:#efe6d5;border-left:4px solid #9b5b2d;font:italic 20px Georgia}dl{margin:16px 0}dt{font-weight:bold;margin-top:10px}dd{margin:3px 0 0;white-space:pre-wrap}.actions{margin-top:22px}.muted{color:#46554e}#notice{min-height:24px;margin:5px 0}dialog{width:min(680px,96vw);max-height:92dvh;border:1px solid #d9cdb8;border-radius:16px;background:#f7f2e8;color:inherit;padding:0}dialog::backdrop{background:#082e35aa}form{padding:20px}form h2{font-size:32px;margin-bottom:12px}label{display:block;font-weight:650;margin:10px 0}label input,label textarea,label select{display:block;margin-top:4px}textarea{min-height:64px;resize:vertical}.footer{position:sticky;bottom:0;background:#f7f2e8;padding:8px 0}.error{color:#8b2617;margin:0}.secondary{background:none;border:0;text-decoration:underline;padding:4px}.backup{margin-top:auto}
@media(max-width:820px){body{display:block}aside{min-height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px}.brand{font-size:21px;border:0;padding:0;margin:0 10px 0 0}.brand span{display:none}.backup{margin-top:0}}
@media(max-width:550px){.columns{grid-template-columns:1fr}.list{max-height:220px;overflow:auto}.mobile-hidden{display:none}.tools{margin-top:8px}}
.sync-banner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:10px 0 14px;padding:12px 16px;background:#e0ebe3;border:1px solid #9aab9e;border-radius:9px}.sync-banner p{margin:0}.sync-banner a{text-decoration:none}.sync-banner a:hover{text-decoration:underline}.sync-banner a:focus-visible{outline:3px solid #ac6b25;outline-offset:3px}
</style>
<aside aria-label="Menu">
<p class="brand"><span aria-hidden="true">✦</span>Meu Dicionário<br>Pessoal</p>
<button id="words" aria-pressed="true">Minhas palavras</button>
<button id="collections" aria-pressed="false">Coleções</button>
<button id="review" aria-pressed="false">Revisar palavras</button>
<button id="export" class="backup">Exportar backup</button>
<button id="import">Importar backup</button>
<input id="file" type="file" accept=".json,application/json" hidden>
</aside>
<main>
<header><h1 id="heading">Minhas palavras</h1><button id="new" class="action new">＋ Nova ficha</button></header>
<section class="sync-banner" aria-label="Armazenamento das fichas">
<p><strong>Você está na versão local.</strong> As fichas salvas pelo ChatGPT aparecem no dicionário online.</p>
<a class="action primary" href="https://meu-dicionario-pessoal-sync.soeirotech.chatgpt.site/">Abrir dicionário sincronizado</a>
</section>
<div id="notice" role="status"></div>
<div class="tools" id="tools"><input id="query" type="search" aria-label="Buscar palavra, sinônimo ou fonte" placeholder="Buscar palavra, sinônimo ou fonte"><div id="chips" class="chips"></div></div>
<div class="columns" id="columns"><section class="list" id="list" aria-label="Lista de palavras"></section><article class="entry" id="entry" aria-label="Ficha selecionada"></article></div>
</main>
<dialog id="editor" aria-labelledby="edit-title">
<form id="form">
<h2 id="edit-title">Nova ficha</h2>
<label>Palavra ou expressão<input name="word" required maxlength="140"></label>
<label>Classe gramatical<input name="grammar" required maxlength="100" placeholder="Ex.: substantivo feminino"></label>
<div id="sense-fields"></div>
<button class="secondary" id="add-sense" type="button">Adicionar significado</button>
<label>Exemplo de uso<textarea name="example"></textarea></label>
<label>Sinônimos<input name="synonyms" placeholder="Separe por vírgulas"></label>
<label>Minha frase<textarea name="sentence"></textarea></label>
<label>Onde encontrei<textarea name="source" placeholder="Livro, página, trecho ou link"></textarea></label>
<label>Coleções<input name="tags" placeholder="Ex.: Fé, Literatura"></label>
<div class="footer"><p class="error" id="error" role="alert"></p><div class="actions"><button class="action primary">Salvar ficha</button><button class="action" type="button" id="cancel">Cancelar</button></div></div>
</form>
</dialog>
<script>
const $ = id => document.getElementById(id);
const storeKey = 'meu-dicionario-pessoal-v1';
const split = value => value.split(',').map(item => item.trim()).filter(Boolean);
const normalize = value => value.normalize('NFD').replace(/\p{M}/gu,'').toLocaleLowerCase('pt-BR').trim();
const sample = [
 {id:'diligencia', word:'diligência', grammar:'substantivo feminino', senses:['Cuidado e atenção ao realizar uma tarefa.','(Jurídico) Ato para apurar ou esclarecer um fato.','(Histórico) Carruagem de passageiros.'], example:'Ela organizou os documentos com diligência.', synonyms:'zelo, cuidado, empenho', sentence:'', source:'', tags:'Literatura'},
 {id:'prudencia', word:'prudência', grammar:'substantivo feminino', senses:['Cuidado ao avaliar uma situação e decidir como agir.'], example:'Ela agiu com prudência antes de tomar a decisão.', synonyms:'cautela, ponderação', sentence:'', source:'', tags:'Fé'},
 {id:'zelo', word:'zelo', grammar:'substantivo masculino', senses:['Dedicação e cuidado com aquilo que se faz.'], example:'Ele cuidou dos livros com zelo.', synonyms:'diligência, dedicação', sentence:'', source:'', tags:'Fé, Literatura'}
];
let records = sample, selected = sample[0].id, collection = '', editing = '', mode = 'words', reviewSet = [], reviewIndex = 0, revealed = false;
const fields = ['word','grammar','example','synonyms','sentence','source','tags'];
function valid(item) {
 return item && typeof item.id === 'string' && fields.every(key => typeof item[key] === 'string') && item.word.trim() && item.grammar.trim() && Array.isArray(item.senses) && item.senses.length >= 1 && item.senses.length <= 3 && item.senses.every(s => typeof s === 'string' && s.trim());
}
try {
 const data = JSON.parse(localStorage.getItem(storeKey));
 if(Array.isArray(data) && data.every(valid)) records = data;
} catch { $('notice').textContent = 'Não foi possível ler as fichas deste navegador.'; }
function save(next) {
 localStorage.setItem(storeKey,JSON.stringify(next));
 records = next;
}
function element(parent, tag, text, className) {
 const node = document.createElement(tag);
 if(text) node.textContent = text;
 if(className) node.className = className;
 parent.append(node);
 return node;
}
function button(parent,label,action,className='action') {
 const node = element(parent,'button',label,className);
 node.type = 'button';
 node.onclick = action;
 return node;
}
function pair(parent,label,value) {
 if(!value) return;
 element(parent,'dt',label);
 element(parent,'dd',value);
}
function formatted(record) {
 const values = [record.word,record.grammar,record.senses.map((sense,i) => (i+1)+'. '+sense).join('\n'),record.example,record.synonyms,record.sentence,record.source];
 return ['Palavra ou expressão','Classe gramatical','Significado','Exemplo de uso','Sinônimos','Minha frase','Onde encontrei'].map((label,i) => '**'+label+'**\n'+values[i]).join('\n\n');
}
async function copy(record) {
 try {
  await navigator.clipboard.writeText(formatted(record));
  $('notice').textContent = 'Ficha copiada.';
 } catch {
  $('notice').textContent = 'A cópia automática falhou. Selecione o texto para copiar.';
  const box = element($('entry'),'textarea',formatted(record));
  box.setAttribute('aria-label','Ficha para copiar');
  box.readOnly = true;
  box.select();
 }
}
function showEntry(record) {
 const area = $('entry');
 const head = element(area,'div',null,'entry-head');
 element(head,'h2',record.word);
 element(head,'em',record.grammar);
 const list = element(area,'ol',null,'senses');
 record.senses.forEach(sense => element(list,'li',sense));
 if(record.example) element(area,'blockquote',record.example);
 const details = element(area,'dl');
 pair(details,'Sinônimos',record.synonyms);
 pair(details,'Minha frase',record.sentence);
 pair(details,'Onde encontrei',record.source);
 pair(details,'Coleções',record.tags);
 const related = records.filter(item => item.id !== record.id && split(record.synonyms).some(word => normalize(word) === normalize(item.word)));
 if(related.length) {
  const links = element(area,'div',null,'chips');
  related.forEach(item => button(links,item.word,() => openWord(item.id)));
 }
 const actions = element(area,'div',null,'actions');
 button(actions,'Editar ficha',() => edit(record),'action primary');
 button(actions,'Copiar ficha',() => copy(record));
}
function openWord(id) {
 selected = id;
 mode = 'words';
 collection = '';
 $('query').value = '';
 render();
 if(matchMedia('(max-width: 550px)').matches) $('entry').scrollIntoView({block:'start'});
}
function render() {
 $('heading').textContent = {words:'Minhas palavras',collections:'Coleções',review:'Revisar palavras'}[mode];
 for(const name of ['words','collections','review']) $(name).setAttribute('aria-pressed',String(name === mode));
 const list = $('list'), area = $('entry'), chips = $('chips');
 list.replaceChildren();
 area.replaceChildren();
 chips.replaceChildren();
 $('tools').hidden = mode === 'review';
 $('tools').style.display = mode === 'review' ? 'none' : '';
 list.style.display = mode === 'review' ? 'none' : '';
 $('columns').style.display = mode === 'review' ? 'block' : '';
 if(mode === 'review') {
  const record = reviewSet[reviewIndex];
  if(!record) {
   element(area,'h2','Revisão concluída');
   button(area,'Começar outra revisão',startReview);
   return;
  }
  element(area,'p','Palavra '+(reviewIndex+1)+' de '+reviewSet.length,'muted');
  if(revealed) showEntry(record);
  else {
   element(area,'h2',record.word);
   element(area,'p','Tente lembrar o significado e criar uma frase.');
  }
  const actions = element(area,'div',null,'actions');
  button(actions,revealed ? 'Próxima palavra' : 'Revelar ficha',() => {
   if(revealed) reviewIndex++;
   revealed = !revealed;
   render();
  },'action primary');
  return;
 }
 const tags = [...new Set(records.flatMap(record => split(record.tags)))].sort((a,b) => a.localeCompare(b,'pt-BR'));
 for(const tag of ['',...tags]) {
  const chip = button(chips,tag || 'Todas',() => {collection = tag; render();});
  chip.setAttribute('aria-pressed',String(collection === tag));
 }
 const query = normalize($('query').value);
 const matches = records.filter(record => (!collection || split(record.tags).includes(collection)) && normalize([record.word,record.synonyms,record.source].join(' ')).includes(query));
 if(!matches.some(record => record.id === selected)) selected = matches[0]?.id;
 for(const record of matches) {
  const item = button(list,null,() => {
   selected = record.id;
   render();
   if(matchMedia('(max-width: 550px)').matches) area.scrollIntoView({block:'start'});
   else area.querySelector('h2')?.focus();
  },'word');
  item.setAttribute('aria-current',String(record.id === selected));
  element(item,'strong',record.word);
  element(item,'small',record.grammar,'muted');
 }
 const record = matches.find(item => item.id === selected);
 if(record) {
  showEntry(record);
  area.querySelector('h2').tabIndex = -1;
 } else {
  element(list,'p','Nenhuma ficha encontrada.','muted');
  element(area,'p','Mude os filtros ou crie uma nova ficha.');
 }
}
function startReview() {
 reviewSet = records.map(record => ({record,order:Math.random()})).sort((a,b) => a.order-b.order).slice(0,3).map(item => item.record);
 reviewIndex = 0;
 revealed = false;
 mode = 'review';
 render();
}
function addSense(value='') {
 const parent = $('sense-fields');
 if(parent.children.length >= 3) return;
 const index = parent.children.length + 1;
 const label = element(parent,'label','Significado '+index);
 const area = element(label,'textarea',null);
 area.value = value;
 area.required = index === 1;
 $('add-sense').hidden = index === 3;
}
function edit(record) {
 editing = record?.id || '';
 $('error').textContent = '';
 $('edit-title').textContent = record ? 'Editar ficha' : 'Nova ficha';
 fields.forEach(key => {$('form').elements[key].value = record?.[key] || '';});
 $('sense-fields').replaceChildren();
 (record?.senses || ['']).forEach(addSense);
 $('editor').showModal();
}
$('form').onsubmit = event => {
 event.preventDefault();
 const record = Object.fromEntries(fields.map(key => [key,$('form').elements[key].value.trim()]));
 record.senses = [...$('sense-fields').querySelectorAll('textarea')].map(area => area.value.trim()).filter(Boolean);
 record.id = editing || (globalThis.crypto?.randomUUID?.() ?? Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
 if(!valid(record)) {
  $('error').textContent = 'Preencha a palavra, a classe gramatical e o primeiro significado.';
  return;
 }
 if(records.some(item => item.id !== editing && normalize(item.word) === normalize(record.word))) {
  $('error').textContent = 'Esta palavra já está no seu dicionário.';
  return;
 }
 try {
  save(editing ? records.map(item => item.id === editing ? record : item) : [...records,record]);
 } catch {
  $('error').textContent = 'O navegador não conseguiu salvar a ficha. Confira o armazenamento disponível.';
  return;
 }
 $('editor').close();
 openWord(record.id);
 $('notice').textContent = 'Ficha salva.';
};
$('new').onclick = () => edit();
$('cancel').onclick = () => $('editor').close();
$('add-sense').onclick = () => {
 addSense();
 $('sense-fields').lastElementChild.querySelector('textarea').focus();
};
$('words').onclick = () => {mode = 'words'; collection = ''; render();};
$('collections').onclick = () => {mode = 'collections'; $('query').value = ''; render(); $('chips').querySelector('button')?.focus();};
$('review').onclick = startReview;
$('query').oninput = render;
$('export').onclick = () => {
 const url = URL.createObjectURL(new Blob([JSON.stringify({version:1,records},null,2)],{type:'application/json'}));
 const anchor = document.createElement('a');
 anchor.href = url;
 anchor.download = 'meu-dicionario-backup.json';
 anchor.click();
 setTimeout(() => URL.revokeObjectURL(url),1000);
};
$('import').onclick = () => $('file').click();
$('file').onchange = async event => {
 const file = event.target.files[0];
 if(!file) return;
 try {
  const data = JSON.parse(await file.text());
  if(data.version !== 1 || !Array.isArray(data.records) || !data.records.every(valid)) throw new Error('Formato inválido');
  const merged = [...records];
  for(const record of data.records) {
   if(merged.some(item => normalize(item.word) === normalize(record.word))) continue;
   let id = record.id;
   while(merged.some(item => item.id === id)) id += '-import';
   merged.push({...record,id});
  }
  const count = merged.length-records.length;
  save(merged);
  $('notice').textContent = count ? count+' ficha(s) importada(s).' : 'O backup não continha fichas novas.';
  render();
 } catch {
  $('notice').textContent = 'Não foi possível importar. Use um backup JSON exportado por este dicionário.';
 } finally {
  event.target.value = '';
 }
};
render();
</script>
</html>
