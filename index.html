<style>
*{box-sizing:border-box}body{margin:0;background:#f7f2e8;color:#172c2a;font:16px system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ac6b25;outline-offset:3px}aside{background:#073e43;color:#fff8e9;padding:32px 22px;min-height:100dvh;display:flex;flex-direction:column;gap:12px}.brand{font:bold 28px Georgia;margin:0 0 20px;border-bottom:1px solid #b68547;padding-bottom:28px}.brand span{color:#e7ba78;display:block;font-size:33px}aside button{text-align:left;background:transparent;border:0;color:inherit;padding:12px;border-radius:8px}aside button:hover,aside button[aria-pressed=true]{background:#ffffff22}body{display:grid;grid-template-columns:230px minmax(0,1fr)}main{width:100%;max-width:1280px;margin:auto;padding:clamp(18px,4vw,52px);align-self:start;margin-top:0}header,.tools,.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1,h2{font-family:Georgia,serif;overflow-wrap:anywhere}h1{font-size:clamp(35px,5vw,64px);margin:0 0 12px}h2{font-size:clamp(34px,5vw,62px);margin:0}.tools{margin:16px 0 22px}.tools input{flex:1 1 250px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button,.action{border:1px solid #9aab9e;border-radius:9px;padding:9px 13px;background:#fffaf1}.chips button[aria-pressed=true],.primary{background:#085359;color:white;border-color:#085359}.new{background:#864c20;color:white;border-color:#864c20}input,textarea,select{width:100%;padding:10px;border:1px solid #a5ada2;border-radius:7px;background:#fffdf8;color:#142725}.columns{display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,2.25fr);gap:16px}.list,.entry{border:1px solid #d9cdb8;border-radius:14px;background:#fffbf3;padding:12px;min-width:0}.entry{padding:clamp(18px,4vw,36px);overflow-wrap:anywhere}.word{display:block;width:100%;border:0;border-bottom:1px solid #e5dac8;background:none;text-align:left;padding:13px 10px;overflow-wrap:anywhere}.word strong{font:700 23px Georgia}.word small{display:block;margin-top:4px}.word[aria-current=true]{background:#e0ebe3;border-left:4px solid #a46a31;border-radius:7px}.entry-head{border-bottom:1px solid #b88b53;padding-bottom:16px}.entry-head em{color:#46554e}.senses{padding-left:25px;line-height:1.6}.senses li::marker{color:#864c20;font-weight:bold}blockquote{margin:16px 0;padding:14px 18px;background:#efe6d5;border-left:4px solid #9b5b2d;font:italic 20px Georgia}dl{margin:16px 0}dt{font-weight:bold;margin-top:10px}dd{margin:3px 0 0;white-space:pre-wrap}.actions{margin-top:22px}.muted{color:#46554e}#notice{min-height:24px;margin:5px 0}dialog{width:min(680px,96vw);max-height:92dvh;border:1px solid #d9cdb8;border-radius:16px;background:#f7f2e8;color:inherit;padding:0}dialog::backdrop{background:#082e35aa}form{padding:20px}form h2{font-size:32px;margin-bottom:12px}label{display:block;font-weight:650;margin:10px 0}label input,label textarea,label select{display:block;margin-top:4px}textarea{min-height:64px;resize:vertical}.footer{position:sticky;bottom:0;background:#f7f2e8;padding:8px 0}.error{color:#8b2617;margin:0}.secondary{background:none;border:0;text-decoration:underline;padding:4px}.backup{margin-top:auto}
@media(max-width:820px){body{display:block}aside{min-height:auto;flex-direction:row;align-items:center;flex-wrap:wrap;padding:12px}.brand{font-size:21px;border:0;padding:0;margin:0 10px 0 0}.brand span{display:none}.backup{margin-top:0}}
@media(max-width:550px){.columns{grid-template-columns:1fr}.list{max-height:220px;overflow:auto}.mobile-hidden{display:none}.tools{margin-top:8px}}

.views{display:grid;gap:6px}
.backups{margin-top:auto;border-top:1px solid #ffffff40;padding-top:12px}
.backups summary{cursor:pointer;padding:9px 12px}
.backups button{display:block;width:100%}
.sync-banner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:0 0 22px;padding:12px 16px;background:#e0ebe3;border:1px solid #9aab9e;border-radius:9px}
.sync-banner p{margin:0;line-height:1.45}
.sync-banner a{text-decoration:none;text-align:center}

.sync-banner a:focus-visible,.backups summary:focus-visible{outline:3px solid #ac6b25;outline-offset:3px}
.tools{display:grid;gap:10px;margin:6px 0 16px}

.word-panel .list{border:0;background:transparent;padding:0}

@media(max-width:820px){
 aside{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
 .brand{margin:0}.brand br{display:none}.brand br::after{content:" "}
 .views{grid-column:1/-1;grid-row:2;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
 .views button{text-align:center;padding:9px 4px;line-height:1.2}

/* Layout para celular */
@media (max-width: 550px) {
  aside { padding: 12px 14px 10px; }
  .brand { font-size: 20px; line-height: 1.15; align-self: center; }
  .views button, .backups summary, .backups button { min-height: 44px; }
  .backups summary { padding: 11px 7px; }
  .backups button { padding-inline: 8px; }
  main { padding: 14px 14px 28px; }
  .sync-banner { padding: 10px 12px; gap: 8px; margin-bottom: 14px; }
  .sync-banner p { flex: 1 1 165px; font-size: 14px; line-height: 1.35; }
  .sync-banner .action { flex: 0 1 auto; min-height: 44px; }
  header { align-items: center; gap: 8px; }
  h1 { margin: 0; font-size: clamp(27px, 8vw, 37px); line-height: 1.08; }
  header .new { min-height: 44px; white-space: nowrap; }
  .tools { position: sticky; top: 0; z-index: 2; gap: 6px; margin: 8px -14px 10px; padding: 8px 14px; background: #f7f2e8; }
  .tools input, .action, .chips button { min-height: 44px; }
  #chips { flex-wrap: nowrap; overflow-x: auto; padding: 3px 3px 5px; }
  #chips button { flex: none; white-space: nowrap; }
  .columns { gap: 12px; }
  .word-panel { padding: 8px; }
  .word-panel .list { max-height: min(32dvh, 245px); }
  .word { min-height: 48px; padding: 8px 10px; }
  .word strong { font-size: 20px; }
  .entry { scroll-margin-top: 124px; padding: 16px; }
  .entry h2 { font-size: clamp(29px, 9vw, 44px); }
  .entry .actions .action { flex: 1 1 auto; }
  #editor { inset: auto 0 0; margin: 0; width: 100%; max-width: none; max-height: 94dvh; border-radius: 16px 16px 0 0; overscroll-behavior: contain; }
  #editor form { padding: 14px 14px max(12px, env(safe-area-inset-bottom)); }
  #editor .footer { bottom: 0; z-index: 1; }
  #editor .footer .actions { margin-top: 6px; }
  #editor .footer .actions .action { flex: 1 1 100px; }
  #add-sense { min-height: 44px; }
  #login form { padding: 16px; }
}
.search-row { display: flex; gap: 8px; min-width: 0; }
.search-row input { flex: 1; min-width: 0; }
.search-row input::-webkit-search-cancel-button { display: none; }
.search-row button { flex: none; }
.word-panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 10px 10px; }
.word-panel-heading h2 { padding: 0; }
#word-count { font-size: .82rem; color: #46554e; text-align: right; }

.brand {
  display: flex; align-items: center; gap: 10px; min-width: 0;
  margin: 0; padding: 0 0 20px; border-bottom: 1px solid #477074;
  font-size: 22px; line-height: 1.08;
}
.brand img { flex: none; object-fit: contain; background: #052f33; border: 1px solid #518084; border-radius: 12px; padding: 3px; }
.brand small { display: block; margin-top: 4px; color: #f3cd94; font: 600 12px system-ui, sans-serif; }
.views { gap: 4px; }
.views button { min-height: 46px; padding: 9px 12px; border: 1px solid transparent; }
.views button[aria-pressed=true] { background: #fff3df; color: #073e43; font-weight: 650; }
.views button:focus-visible, .backups summary:focus-visible, .backups button:focus-visible { outline-color: #f3cd94; }
.backups summary { border-radius: 8px; }
.backups summary:hover, .backups[open] summary { background: #ffffff18; }
.backups button { min-height: 44px; }
@media (min-width: 821px) {
  body { grid-template-columns: 250px minmax(0, 1fr); }
  aside { position: sticky; top: 0; align-self: start; height: 100dvh; min-height: 0; overflow: auto; padding: 25px 17px 16px; gap: 17px; }
}
@media (max-width: 820px) {
  aside { align-items: stretch; grid-template-columns: minmax(0, 1fr) auto; }
  .brand { padding: 0; border: 0; font-size: clamp(17px, 5vw, 22px); }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  .brand small { margin-top: 2px; }
  .views { background: #052f33; border-radius: 11px; padding: 4px; }
  .views button { min-height: 44px; padding: 6px 4px; text-align: center; font-size: .88rem; }
  .backups { align-self: center; }
  .backups summary { border: 1px solid #518084; padding: 9px 7px; }
  .backups[open] { grid-column: 1 / -1; grid-row: 3; }
  .backups[open] > div { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
  .backups[open] button { text-align: center; }
}
@media (prefers-reduced-motion: no-preference) {
  .views button { transition: background-color .15s, color .15s; }
}

/* Identidade visual do dicionário */
:root {
  --paper: #f7f3eb;
  --surface: #fffdf8;
  --ink: #122f32;
  --petrol: #073e43;
  --petrol-deep: #062f34;
  --gold: #e7ba78;
  --line: #ddd4c3;
}
body { color: var(--ink); background: var(--paper); }
aside { background: linear-gradient(168deg, var(--petrol), var(--petrol-deep)); }
.brand { border-color: #ffffff35; letter-spacing: -.015em; }
.brand img { padding: 0; background: #fff3df; border-color: #fff3df; }
.brand small { color: var(--gold); }
main { max-width: 1340px; }
header { margin: 0 0 18px; }
h1 { margin: 0; letter-spacing: -.045em; line-height: 1.05; }
header .new { color: #1d281f; background: var(--gold); border-color: #bd8b48; font-weight: 700; padding-inline: 16px; }
header .new:hover { background: #f0cb93; }
.sync-banner { margin: 0 0 15px; padding: 10px 12px; background: #ebf0eb; border-color: #c8d6ce; border-radius: 10px; }
.sync-banner p { font-size: .87rem; color: #29464a; }
.sync-banner p strong { color: var(--ink); }
.sync-banner .action { flex: none; }
.search-row { position: relative; }
.search-row::before {
  content: ''; position: absolute; top: 50%; left: 14px; width: 12px; height: 12px;
  border: 2px solid #506763; border-radius: 50%; transform: translateY(-65%); pointer-events: none;
}
.search-row::after {
  content: ''; position: absolute; top: 50%; left: 25px; width: 7px; height: 2px;
  background: #506763; transform: translateY(5px) rotate(45deg); pointer-events: none;
}
.search-row input { padding-left: 40px; min-height: 46px; border-color: #b7c5bd; background: var(--surface); }
.word-panel, .entry { background: var(--surface); border-color: var(--line); box-shadow: 0 4px 16px #173a3010; }
.word-panel-heading { margin-bottom: 5px; border-bottom: 1px solid var(--line); }
.word:hover { background: #f1f4ef; }
.word[aria-current=true] { background: #e5efeb; border-left-color: #bc833e; }
.entry-head { border-color: #dec8a6; }
.entry-head h2 { letter-spacing: -.035em; line-height: 1.05; }
blockquote { background: #f7efe0; border-left-color: #bc833e; }
@media (min-width: 821px) {
  .columns { grid-template-columns: minmax(205px, 1fr) minmax(0, 2.4fr); gap: 20px; }
  .entry { min-height: 380px; }
}
@media (max-width: 550px) {
  header { margin-bottom: 12px; }
  .sync-banner { margin-bottom: 6px; }
  .sync-banner .action { min-height: 44px; }
  .tools { background: var(--paper); }
  .entry { scroll-margin-top: 125px; }
}

/* Navegação e atalhos */
.brand { font-size: 18px; gap: 9px; padding-bottom: 14px; }
.brand img { width: 34px; height: 34px; border-radius: 8px; }
.views button { display: flex; align-items: center; gap: 9px; }
.nav-icon { width: 22px; flex: none; font: 700 21px/1 system-ui, sans-serif; text-align: center; }
.backup-mobile { display: none; }
@media (max-width: 820px) {
  :root { --bottom-nav-height: calc(58px + env(safe-area-inset-bottom)); }
  html { scroll-padding-bottom: var(--bottom-nav-height); }
  aside { display: block; padding: 10px max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left)); }
  .brand { padding: 0; }
  main { padding-bottom: calc(24px + var(--bottom-nav-height)); }
  .views {
    position: fixed; z-index: 5; left: 0; right: 25%; bottom: 0;
    height: var(--bottom-nav-height); gap: 2px;
    padding: 3px 2px calc(3px + env(safe-area-inset-bottom)) max(3px, env(safe-area-inset-left));
    border-radius: 0; border-top: 1px solid #518084;
    background: var(--petrol-deep);
  }
  .views button, .backup-mobile { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px; }
  .views button { min-height: 0; padding: 1px 2px; font-size: clamp(.62rem, 2.3vw, .8rem); }
  .nav-icon { font-size: 19px; }
  .backups {
    position: fixed; z-index: 6; right: 0; bottom: 0; width: 25%;
    height: var(--bottom-nav-height); margin: 0; padding: 3px max(3px, env(safe-area-inset-right)) calc(3px + env(safe-area-inset-bottom)) 2px;
    border-top: 1px solid #518084; background: var(--petrol-deep);
  }
  .backups summary { display: grid; place-items: center; list-style: none; height: 100%; padding: 0; border: 0; }
  .backups summary::-webkit-details-marker { display: none; }
  .backup-desktop { display: none; }
  .backup-mobile { font-size: clamp(.62rem, 2.3vw, .8rem); }
  .backups[open] summary { background: #fff3df; color: var(--petrol); }
  .backups[open] > div {
    position: absolute; right: 8px; bottom: calc(100% + 8px); width: min(290px, 95vw);
    padding: 8px; border: 1px solid #518084; border-radius: 12px; background: var(--petrol-deep);
    box-shadow: 0 5px 18px #173a3033;
  }
}
</style>
<aside aria-label="Menu">
<div class="brand"><img src="./marca-monograma.png" width="34" height="34" alt=""><div>Meu Dicionário Pessoal</div></div>
<nav class="views" aria-label="Seções do dicionário">
<button id="words" aria-pressed="true"><span class="nav-icon" aria-hidden="true">≡</span><span>Minhas palavras</span></button>
<button id="collections" aria-pressed="false"><span class="nav-icon" aria-hidden="true">▤</span><span>Coleções</span></button>
<button id="review" aria-pressed="false"><span class="nav-icon" aria-hidden="true">↻</span><span>Revisar</span></button>
</nav>
<details class="backups">
<summary><span class="backup-desktop">Backups</span><span class="backup-mobile"><span class="nav-icon" aria-hidden="true">⋯</span>Mais</span></summary>
<div><button id="export">Exportar backup</button>
<button id="import">Importar backup</button></div>
</details>
<input id="file" type="file" accept=".json,application/json" hidden>
</aside>
<main>
<header><h1 id="heading">Minhas palavras</h1><button id="new" class="action new">＋ Nova ficha</button></header>
<section class="sync-banner" aria-label="Armazenamento das fichas">
<p><strong id="storage-label">Dicionário local</strong><br><span id="storage-description">As fichas criadas aqui ficam neste navegador. Entre para sincronizar com seus outros dispositivos.</span></p>
<button class="action primary" type="button" id="sign-in">Entrar por e-mail</button>
<button class="action" type="button" id="sign-out" hidden>Sair</button>
</section>
<div id="notice" role="status"></div>
<div class="tools" id="tools"><div class="search-row"><input id="query" type="search" aria-label="Buscar palavra, sinônimo ou fonte" placeholder="Buscar palavra, sinônimo ou fonte"><button type="button" id="clear-query" class="action" aria-label="Limpar busca" hidden>Limpar</button></div><div id="chips" class="chips" role="group" aria-label="Filtrar por coleção"></div></div>
<div class="columns" id="columns"><section class="word-panel" aria-labelledby="word-list-label"><div class="word-panel-heading"><h2 id="word-list-label">Fichas</h2><span id="word-count" aria-live="polite" aria-atomic="true"></span></div><div class="list" id="list"></div></section><article class="entry" id="entry" aria-label="Ficha selecionada"></article></div>
</main>
<dialog id="login" aria-labelledby="login-title">
<form id="login-form">
<h2 id="login-title">Entrar por e-mail</h2>
<label>E-mail<input name="email" type="email" autocomplete="email" required></label>
<p id="login-status" role="status"></p>
<div class="actions"><button class="action primary">Enviar link</button><button type="button" id="close-login" class="action">Fechar</button></div>
</form>
</dialog>
<dialog id="editor" aria-labelledby="edit-title">
<form id="form">
<h2 id="edit-title">Nova ficha</h2>
<label>Palavra ou expressão<input name="word" required maxlength="140"></label>
<label>Classe gramatical<input name="grammar" required maxlength="100" placeholder="Ex.: substantivo feminino"></label>
<div id="sense-fields"></div>
<button class="secondary" id="add-sense" type="button">Adicionar significado</button>
<label>Exemplo de uso<textarea name="example"></textarea></label>
<label>Sinônimos<input name="synonyms" placeholder="Separe por vírgulas"></label>
<label>Minha frase<textarea name="sentence"></textarea></label>
<label>Onde encontrei<textarea name="source" placeholder="Livro, página, trecho ou link"></textarea></label>
<label>Coleções<input name="tags" placeholder="Ex.: Fé, Literatura"></label>
<div class="footer"><p class="error" id="error" role="alert"></p><div class="actions"><button class="action primary">Salvar ficha</button><button class="action" type="button" id="cancel">Cancelar</button></div></div>
</form>
</dialog>
<script type="module">
import { client, online } from "./dictionary-online.js";
const $ = id => document.getElementById(id);
const storeKey = 'meu-dicionario-pessoal-v1';
const displayWord = word => word.replace(/\p{L}/u, letter => letter.toLocaleUpperCase('pt-BR'));
const alphabetical = new Intl.Collator('pt-BR', { sensitivity: 'base', numeric: true });
const split = value => value.split(',').map(item => item.trim()).filter(Boolean);
const normalize = value => value.normalize('NFD').replace(/\p{M}/gu,'').toLocaleLowerCase('pt-BR').trim();
const sample = [
 {id:'diligencia', word:'diligência', grammar:'substantivo feminino', senses:['Cuidado e atenção ao realizar uma tarefa.','(Jurídico) Ato para apurar ou esclarecer um fato.','(Histórico) Carruagem de passageiros.'], example:'Ela organizou os documentos com diligência.', synonyms:'zelo, cuidado, empenho', sentence:'', source:'', tags:'Literatura'},
 {id:'prudencia', word:'prudência', grammar:'substantivo feminino', senses:['Cuidado ao avaliar uma situação e decidir como agir.'], example:'Ela agiu com prudência antes de tomar a decisão.', synonyms:'cautela, ponderação', sentence:'', source:'', tags:'Fé'},
 {id:'zelo', word:'zelo', grammar:'substantivo masculino', senses:['Dedicação e cuidado com aquilo que se faz.'], example:'Ele cuidou dos livros com zelo.', synonyms:'diligência, dedicação', sentence:'', source:'', tags:'Fé, Literatura'}
];
let records = sample, selected = sample[0].id, collection = '', editing = '', mode = 'words', reviewSet = [], reviewIndex = 0, revealed = false;
const fields = ['word','grammar','example','synonyms','sentence','source','tags'];
function valid(item) {
 return item && typeof item.id === 'string' && fields.every(key => typeof item[key] === 'string') && item.word.trim() && item.grammar.trim() && Array.isArray(item.senses) && item.senses.length >= 1 && item.senses.length <= 3 && item.senses.every(s => typeof s === 'string' && s.trim());
}
try {
 const data = JSON.parse(localStorage.getItem(storeKey));
 if(Array.isArray(data) && data.every(valid)) records = data;
} catch { $('notice').textContent = 'Não foi possível ler as fichas deste navegador.'; }
let account = null;
let refreshToken = 0;
let localRecords = records;
function save(next) {
 localRecords = next;
 localStorage.setItem(storeKey,JSON.stringify(next));
 records = next;
}
function element(parent, tag, text, className) {
 const node = document.createElement(tag);
 if(text) node.textContent = text;
 if(className) node.className = className;
 parent.append(node);
 return node;
}
function button(parent,label,action,className='action') {
 const node = element(parent,'button',label,className);
 node.type = 'button';
 node.onclick = action;
 return node;
}
function pair(parent,label,value) {
 if(!value) return;
 element(parent,'dt',label);
 element(parent,'dd',value);
}
function formatted(record) {
 const values = [record.word,record.grammar,record.senses.map((sense,i) => (i+1)+'. '+sense).join('\n'),record.example,record.synonyms,record.sentence,record.source];
 return ['Palavra ou expressão','Classe gramatical','Significado','Exemplo de uso','Sinônimos','Minha frase','Onde encontrei'].map((label,i) => '**'+label+'**\n'+values[i]).join('\n\n');
}
async function copy(record) {
 try {
  await navigator.clipboard.writeText(formatted(record));
  $('notice').textContent = 'Ficha copiada.';
 } catch {
  $('notice').textContent = 'A cópia automática falhou. Selecione o texto para copiar.';
  const box = element($('entry'),'textarea',formatted(record));
  box.setAttribute('aria-label','Ficha para copiar');
  box.readOnly = true;
  box.select();
 }
}
function showEntry(record) {
 const area = $('entry');
 const head = element(area,'div',null,'entry-head');
 element(head,'h2',displayWord(record.word));
 element(head,'em',record.grammar);
 const list = element(area,'ol',null,'senses');
 record.senses.forEach(sense => element(list,'li',sense));
 if(record.example) element(area,'blockquote',record.example);
 const details = element(area,'dl');
 pair(details,'Sinônimos',record.synonyms);
 pair(details,'Minha frase',record.sentence);
 pair(details,'Onde encontrei',record.source);
 pair(details,'Coleções',record.tags);
 const related = records.filter(item => item.id !== record.id && split(record.synonyms).some(word => normalize(word) === normalize(item.word)));
 if(related.length) {
  const links = element(area,'div',null,'chips');
  related.forEach(item => button(links,displayWord(item.word),() => openWord(item.id)));
 }
 const actions = element(area,'div',null,'actions');
 button(actions,'Editar ficha',() => edit(record),'action primary');
 button(actions,'Copiar ficha',() => copy(record));
}
function openWord(id) {
 selected = id;
 mode = 'words';
 collection = '';
 $('query').value = '';
 render();
 if(matchMedia('(max-width: 550px)').matches) $('entry').scrollIntoView({block:'start'});
}
function render() {
 $('heading').textContent = {words:'Minhas palavras',collections:'Coleções',review:'Revisar palavras'}[mode];
 for(const name of ['words','collections','review']) $(name).setAttribute('aria-pressed',String(name === mode));
 const list = $('list'), area = $('entry'), chips = $('chips');
 list.replaceChildren();
 area.replaceChildren();
 chips.replaceChildren();
 $('tools').hidden = mode === 'review';
 $('list').parentElement.hidden = mode === 'review';
 $('tools').style.display = mode === 'review' ? 'none' : '';
 list.style.display = mode === 'review' ? 'none' : '';
 $('columns').style.display = mode === 'review' ? 'block' : '';
 if(mode === 'review') {
  const record = reviewSet[reviewIndex];
  if(!record) {
   element(area,'h2','Revisão concluída');
   button(area,'Começar outra revisão',startReview);
   return;
  }
  element(area,'p','Palavra '+(reviewIndex+1)+' de '+reviewSet.length,'muted');
  if(revealed) showEntry(record);
  else {
   element(area,'h2',displayWord(record.word));
   element(area,'p','Tente lembrar o significado e criar uma frase.');
  }
  const actions = element(area,'div',null,'actions');
  button(actions,revealed ? 'Próxima palavra' : 'Revelar ficha',() => {
   if(revealed) reviewIndex++;
   revealed = !revealed;
   render();
  },'action primary');
  return;
 }
 const tags = [...new Set(records.flatMap(record => split(record.tags)))].sort((a,b) => a.localeCompare(b,'pt-BR'));
 for(const tag of ['',...tags]) {
  const chip = button(chips,tag || 'Todas',() => {collection = tag; render();});
  chip.setAttribute('aria-pressed',String(collection === tag));
 }
 const query = normalize($('query').value);
 $('clear-query').hidden = $('query').value.length === 0;
 const matches = records.filter(record => (!collection || split(record.tags).includes(collection)) && normalize([record.word,record.synonyms,record.source].join(' ')).includes(query))
  .sort((first, second) => alphabetical.compare(first.word, second.word));
 const countLabel = matches.length === 1 ? '1 ficha' : matches.length + ' fichas';
 const count = query || collection ? countLabel + ' de ' + records.length : countLabel;
 if ($('word-count').textContent !== count) $('word-count').textContent = count;
 if(!matches.some(record => record.id === selected)) selected = matches[0]?.id;
 for(const record of matches) {
  const item = button(list,null,() => {
   selected = record.id;
   render();
   if(matchMedia('(max-width: 550px)').matches) area.scrollIntoView({block:'start'});
   else area.querySelector('h2')?.focus();
  },'word');
  item.setAttribute('aria-current',String(record.id === selected));
  element(item,'strong',displayWord(record.word));
  element(item,'small',record.grammar,'muted');
 }
 const record = matches.find(item => item.id === selected);
 if(record) {
  showEntry(record);
  area.querySelector('h2').tabIndex = -1;
 } else {
  element(list,'p','Nenhuma ficha encontrada.','muted');
  element(area,'p','Mude os filtros ou crie uma nova ficha.');
 }
}
function startReview() {
 reviewSet = records.map(record => ({record,order:Math.random()})).sort((a,b) => a.order-b.order).slice(0,3).map(item => item.record);
 reviewIndex = 0;
 revealed = false;
 mode = 'review';
 render();
}
function addSense(value='') {
 const parent = $('sense-fields');
 if(parent.children.length >= 3) return;
 const index = parent.children.length + 1;
 const label = element(parent,'label','Significado '+index);
 const area = element(label,'textarea',null);
 area.value = value;
 area.required = index === 1;
 $('add-sense').hidden = index === 3;
}
function edit(record) {
 editing = record?.id || '';
 $('error').textContent = '';
 $('edit-title').textContent = record ? 'Editar ficha' : 'Nova ficha';
 fields.forEach(key => {$('form').elements[key].value = record?.[key] || '';});
 $('sense-fields').replaceChildren();
 (record?.senses || ['']).forEach(addSense);
 $('editor').showModal();
}
$('form').onsubmit = async event => {
 event.preventDefault();
 const record = Object.fromEntries(fields.map(key => [key,$('form').elements[key].value.trim()]));
 record.senses = [...$('sense-fields').querySelectorAll('textarea')].map(area => area.value.trim()).filter(Boolean);
 record.id = editing || (globalThis.crypto?.randomUUID?.() ?? Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));
 if(!valid(record)) {
  $('error').textContent = 'Preencha a palavra, a classe gramatical e o primeiro significado.';
  return;
 }
 if(records.some(item => item.id !== editing && normalize(item.word) === normalize(record.word))) {
  $('error').textContent = 'Esta palavra já está no seu dicionário.';
  return;
 }
 try {
  if(account) {
   const saved = await online.save(record, Boolean(editing));
   record.id = saved.id;
   records = [...records.filter(item => item.id !== record.id), saved];
  } else {
   save(editing ? records.map(item => item.id === editing ? record : item) : [...records,record]);
  }
 } catch {
  $('error').textContent = 'O navegador não conseguiu salvar a ficha. Confira o armazenamento disponível.';
  return;
 }
 $('editor').close();
 openWord(record.id);
 $('notice').textContent = 'Ficha salva.';
};
$('new').onclick = () => edit();
$('cancel').onclick = () => $('editor').close();
$('add-sense').onclick = () => {
 addSense();
 $('sense-fields').lastElementChild.querySelector('textarea').focus();
};
$('words').onclick = () => {mode = 'words'; collection = ''; render();};
$('collections').onclick = () => {mode = 'collections'; $('query').value = ''; render(); $('chips').querySelector('button')?.focus();};
$('review').onclick = startReview;
for (const section of document.querySelectorAll('.views button')) {
 section.addEventListener('click', () => { document.querySelector('.backups').open = false; });
}
document.querySelector('.backups').addEventListener('keydown', event => {
 const menu = event.currentTarget;
 if (event.key === 'Escape' && menu.open) {
  menu.open = false;
  menu.querySelector('summary').focus();
 }
});
$('query').oninput = render;
$('clear-query').onclick = () => {
 $('query').value = '';
 render();
 $('query').focus();
};
$('export').onclick = () => {
 const url = URL.createObjectURL(new Blob([JSON.stringify({version:1,records},null,2)],{type:'application/json'}));
 const anchor = document.createElement('a');
 anchor.href = url;
 anchor.download = 'meu-dicionario-backup.json';
 anchor.click();
 setTimeout(() => URL.revokeObjectURL(url),1000);
};
$('import').onclick = () => $('file').click();
$('file').onchange = async event => {
 const file = event.target.files[0];
 if(!file) return;
 try {
  const data = JSON.parse(await file.text());
  if(data.version !== 1 || !Array.isArray(data.records) || !data.records.every(valid)) throw new Error('Formato inválido');
  const merged = [...records];
  for(const record of data.records) {
   if(merged.some(item => normalize(item.word) === normalize(record.word))) continue;
   let id = record.id;
   while(merged.some(item => item.id === id)) id += '-import';
   merged.push({...record,id});
  }
  const count = account ? await online.import(merged.slice(records.length)) : merged.length-records.length;
  if(account) await refreshOnline();
  else save(merged);
  $('notice').textContent = count ? count+' ficha(s) importada(s).' : 'O backup não continha fichas novas.';
  render();
 } catch {
  $('notice').textContent = 'Não foi possível importar. Use um backup JSON exportado por este dicionário.';
 } finally {
  event.target.value = '';
 }
};
async function refreshOnline() {
 const user = account;
 const token = ++refreshToken;
 if(!user) return;
 const incoming = await online.load();
 if(account?.id !== user.id || token !== refreshToken) return;
 records = incoming.filter(valid);
 render();
}
function reportSyncError() {
 $('notice').textContent = 'Não foi possível sincronizar. Tente recarregar a página.';
}
async function setAccount(session) {
 const previous = account;
 const next = session?.user ?? null;
 if(previous?.id === next?.id) return;
 account = next;
 ++refreshToken;
 if($('editor').open) $('editor').close();
 records = next ? [] : localRecords;
 $('sign-in').hidden = Boolean(next);
 $('sign-out').hidden = !next;
 $('storage-label').textContent = next ? 'Dicionário sincronizado' : 'Dicionário local';
 $('storage-description').textContent = next
  ? 'As fichas desta conta aparecem nos dispositivos em que você entrar.'
  : 'As fichas criadas aqui ficam neste navegador. Entre para sincronizar com seus outros dispositivos.';
 render();
 if(!next) return;
 const marker = storeKey + ':synced:' + next.id;
 try {
  if(localStorage.getItem(marker) !== 'yes') {
   if(localRecords !== sample) await online.import(localRecords);
   localStorage.setItem(marker,'yes');
  }
  await refreshOnline();
 } catch { reportSyncError(); }
}
$('sign-in').onclick = () => {
 $('login-status').textContent = '';
 $('login').showModal();
};
$('close-login').onclick = () => $('login').close();
$('sign-out').onclick = () => online.signOut().catch(reportSyncError);
$('login-form').onsubmit = async event => {
 event.preventDefault();
 const form = event.currentTarget;
 const submit = form.querySelector('button:not([type])');
 submit.disabled = true;
 try {
  await online.sendLink(form.elements.email.value);
  $('login-status').textContent = 'Confira sua caixa de entrada e abra o link neste navegador.';
 } catch {
  $('login-status').textContent = 'Não foi possível enviar o link. Confira o e-mail ou tente novamente mais tarde.';
 } finally { submit.disabled = false; }
};
client.auth.onAuthStateChange((_event, session) => setTimeout(() => {
 setAccount(session).catch(reportSyncError);
}, 0));
window.addEventListener('focus', () => refreshOnline().catch(reportSyncError));
setInterval(() => { if (!document.hidden) refreshOnline().catch(reportSyncError); }, 15000);
render();
</script>
</html>
